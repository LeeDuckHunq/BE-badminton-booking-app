spring.application.name=AlopoApi
server.address=0.0.0.0
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smashzone}
spring.mongodb.database=${MONGODB_DATABASE:smashzone}
app.jwt.secret=${JWT_SECRET:smashzone-development-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:SmashZone Administrator}
