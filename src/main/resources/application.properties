spring.application.name=AlopoApi
server.address=0.0.0.0
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smashzone}
spring.mongodb.database=${MONGODB_DATABASE:smashzone}
app.jwt.secret=${JWT_SECRET:smashzone-development-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:SmashZone Administrator}
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
